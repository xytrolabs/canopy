# Canopy — default desktop configuration
#
# Power when you need it. Simple by default.
#
# Layout implemented here:
#   • System Panel  — slim floating bar across the top
#   • System Tray   — vertical pill on the left edge
#   • Dock          — floating dock, bottom centre
#   • Quick Settings— control centre, opens from the right
#
# Every value below is a normal Noctalia v5 setting; nothing here is a
# Canopy-only extension. Edit freely from Settings — the GUI writes back to
# this same file.

# ── Shell ─────────────────────────────────────────────────────────────────────

[shell]
corner_radius_scale     = 1.0
font_family             = "Space Grotesk"
time_format             = "{:%H:%M}"
date_format             = "%a %d %b"
polkit_agent            = true
settings_show_advanced  = false
show_location           = false
app_icon_colorize       = false
clipboard_enabled       = true

[shell.panel]
transparency_mode          = "glass"
borders                    = true
border_color               = "outline_variant"
border_width               = 1.0
shadow                     = true
launcher_placement         = "floating"
launcher_position          = "center"
control_center_placement   = "attached"
control_center_position    = "right"
session_placement          = "floating"
session_position           = "center"
wallpaper_placement        = "floating"
wallpaper_position         = "center"
clipboard_placement        = "floating"
clipboard_position         = "center"

[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.45

[shell.launcher]
layout                = "full"
width                 = 720
compact               = false
track_usage           = true
sort_by_usage         = true
show_settings_button  = true
show_session_button   = true
show_icons            = true
categories            = true
pinned                = []

# ── Theme ─────────────────────────────────────────────────────────────────────
# The Canopy palette is a restrained purple accent on neutral surfaces, and it
# works with blur and animations turned off.

[theme]
mode                = "dark"
source              = "builtin"
builtin             = "Canopy"
pure_black_dark     = false

[theme.templates]
# Opt in per application from Settings > Appearance > Templates. Left empty so a
# first run never rewrites another application's theme directory unasked.
enable_builtin_templates    = true
builtin_ids                 = []
enable_community_templates  = false

# ── System Panel — top ────────────────────────────────────────────────────────

[bar.main]
position            = "top"
thickness           = 34
radius              = 0
margin_ends         = 0
margin_edge         = 0
padding             = 14
widget_spacing      = 8
background_opacity  = 0.86
compositor_blur     = false
shadow              = false
auto_hide           = false
reserve_space       = true
capsule             = false

start  = ["launcher", "workspaces", "active_window"]
center = ["clock"]
end    = ["media", "notifications", "network", "bluetooth", "volume", "battery", "control-center", "session"]

# ── System Tray — vertical pill, left edge ────────────────────────────────────
# Canopy's own surface: launcher, settings and the quick system controls in one
# slim pill instead of a second row of duplicated indicators.

[bar.tray]
position            = "left"
thickness           = 56
radius              = 28
margin_ends         = 200
margin_edge         = 10
padding             = 8
widget_spacing      = 6
background_opacity  = 0.86
compositor_blur     = false
shadow              = true
auto_hide           = false
reserve_space       = false
capsule             = true
capsule_fill        = "surface_container"
capsule_radius      = 28
capsule_opacity     = 0.94
capsule_border      = "outline_variant"
capsule_border_width = 1.0

start  = []
center = ["launcher", "settings", "network", "volume", "bluetooth", "notifications", "control-center"]
end    = ["lock_keys", "battery"]

# ── Dock — bottom centre ──────────────────────────────────────────────────────
# Pinned ǀ running ǀ minimized. Pinned ordering is stored in `pinned`, running
# state comes from the compositor, so nothing is simulated.

[dock]
enabled             = true
position            = "bottom"
icon_size           = 48
main_axis_padding   = 12
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.88
compositor_blur     = true
radius              = 18
radius_top_left     = 18
radius_top_right    = 18
radius_bottom_left  = 18
radius_bottom_right = 18
margin_ends         = 0
margin_edge         = 10
shadow              = true
show_running        = true
auto_hide           = true
smart_auto_hide     = true
reserve_space       = false
layer               = "top"
active_scale        = 1.0
inactive_scale      = 0.88
magnification       = false
active_opacity      = 1.0
inactive_opacity    = 0.88
show_dots           = false
show_instance_count = true
launcher_position   = "start"
launcher_icon       = "grid-dots"
pinned              = []

# ── Quick Settings — right side ───────────────────────────────────────────────

[control_center]
circular_avatar    = true
show_avatar_border = true

[notification]
enable_daemon             = true
keep_dismissed_in_history = true
background_opacity        = 0.95
border                    = true
border_color              = "outline_variant"
border_width              = 1

# ── Behaviour ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled = true

[backdrop]
enabled         = false
blur_intensity  = 0.45
tint_intensity  = 0.30

[wallpaper.default]
# Canopy ships three gradient washes; the shell renders them itself, so there is
# no wallpaper daemon to manage.
path = ""

[audio]
enable_overdrive      = false
enable_sounds         = false
enable_volume_sounds  = true

[bluetooth]
connect_when_enabled     = false
connection_notifications = false

[brightness]
enable_ddcutil = false
# ── Widgets ───────────────────────────────────────────────────────────────────
# The panel launcher shows the Canopy mark instead of a generic search glyph.
# Installer copies the mark to ~/.local/share/icons; if it is missing the widget
# falls back to the bundled glyph named below.

[widget.launcher]
glyph        = "canopy"
custom_image = "~/.local/share/icons/hicolor/scalable/apps/canopy-mark.svg"
custom_image_colorize = false
