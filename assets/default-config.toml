# Canopy — default desktop configuration
#
# Power when you need it. Simple by default.
#
# Layout implemented here:
#   • System Panel  — slim floating bar across the top
#   • System Tray   — vertical pill on the left edge
#   • Dock          — floating dock, bottom centre
#   • Quick Settings— control centre, opens from the right
#
# Every value below is a normal Noctalia v5 setting; nothing here is a
# Canopy-only extension. Edit freely from Settings — the GUI writes back to
# this same file.

# ── Shell ─────────────────────────────────────────────────────────────────────

[shell]
corner_radius_scale     = 1.0
# Space Grotesk is part of what makes Canopy look like Canopy. Fluent geometry
# and materials, our own face.
font_family             = "Space Grotesk"
time_format             = "{:%H:%M}"
date_format             = "%a %d %b"
polkit_agent            = true
settings_show_advanced  = false
show_location           = false
app_icon_colorize       = false
clipboard_enabled       = true

[shell.panel]
# Floating panels get the Windows 11 card treatment: hairline outline, soft
# shadow, translucency. Blur is requested but this compositor has no
# ext-background-effect, so depth comes from opacity plus the border.
transparency_mode          = "glass"
borders                    = true
border_color               = "outline_variant"
border_width               = 1.0
shadow                     = true
launcher_placement         = "floating"
launcher_position          = "center"
# Win11 flyout: floating card anchored right, opened from the bar's click.
control_center_placement   = "floating"
control_center_position    = "center_right"
open_near_click_control_center = true
session_placement          = "floating"
session_position           = "center"
wallpaper_placement        = "floating"
wallpaper_position         = "center"
clipboard_placement        = "floating"
clipboard_position         = "center"

[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
# Windows elevation is a hint, not a drop shadow: enough to lift a flyout off
# the desktop, never enough to read as a border.
direction = "down"
alpha     = 0.35

[shell.launcher]
# Start-menu behaviour, not a Noctalia search panel: pinned applications in a
# grid are the first thing shown, “All applications” is one click away, and
# the search field is where a Windows or macOS user expects it — on top.
layout                = "full"
width                 = 720
search_position       = "top"
default_view          = "pinned"
categories            = true
app_grid              = true
show_navigation_labels = true
show_settings_button  = true
show_session_button   = true
show_icons            = true
compact               = false
track_usage           = true
sort_by_usage         = true
pinned                = ["firefox", "thunar", "org.gnome.Nautilus", "alacritty", "kitty", "org.gnome.TextEditor"]

[shell.window_switcher]
# Windows Alt+Tab: a compact strip in most-recently-used order.
style         = "compact"
mru           = true
show_caption  = true
show_app_icon = true
show_count    = false

# ── Theme ─────────────────────────────────────────────────────────────────────
# The Canopy palette is a restrained purple accent on neutral surfaces, and it
# works with blur and animations turned off.

[theme]
mode                = "dark"
source              = "builtin"
builtin             = "Canopy"
pure_black_dark     = false

[theme.templates]
# Opt in per application from Settings > Appearance > Templates. Left empty so a
# first run never rewrites another application's theme directory unasked.
enable_builtin_templates    = true
builtin_ids                 = []
enable_community_templates  = false

# ── System Panel — top ────────────────────────────────────────────────────────

[bar.main]
# macOS menu bar: thin, full width, app on the left, status items and the clock
# on the right. Windows 11 material: translucent fill, hairline border, shadow.
position            = "top"
# A menu bar spans the screen edge. The margins and radius this used to carry
# are what made it look like a floating panel: radius rounds the corners and
# the margins inset the whole rect from the edges.
thickness           = 34
radius              = 0
margin_ends         = 0
margin_edge         = 0
padding             = 12
widget_spacing      = 8
# A medium-grey hairline: the bar is charcoal with a separator, not an accent
# frame. The accent belongs to what is active inside it.
border              = "outline_variant"
border_width        = 1.0
background_opacity  = 0.78
compositor_blur     = true
shadow              = false
auto_hide           = false
reserve_space       = true
capsule             = false

start  = ["launcher", "wordmark", "workspaces", "active_window"]
center = []
# The side island already carries network, bluetooth and battery, so the menu
# bar does not repeat them: media, clock, quick settings and power only.
end    = ["media", "clock", "control-center", "session"]

# ── System Tray — vertical pill, left edge ────────────────────────────────────
# Canopy's own surface: launcher, settings and the quick system controls in one
# slim pill instead of a second row of duplicated indicators.

[bar.tray]
position            = "left"
# Thickness is the pill's cross size, so it is sized to the widget row rather
# than to a fixed slab: the island hugs what is inside it.
# Cross size and padding decide how much air the island has around its icons.
# 40 px with 4 px padding read as cramped; 48 with 8 keeps the pill slim but
# stops the icons touching the edges.
thickness           = 56
radius              = 28
margin_ends         = 24
margin_edge         = 10
padding             = 12
widget_spacing      = 10
# The capsule is drawn at capsule_thickness x bar thickness (0.76 by default),
# which is why raising the thickness alone barely widened the island. At 1.0
# the pill is exactly as thick as the bar and the icons get real air.
capsule_thickness   = 1.0
# The bar itself is invisible: a side bar always covers the full edge, and a
# background there reads as a slab running the height of the screen. The one
# visible surface is the capsule group below, which wraps the widget row and is
# therefore exactly as tall as what is inside it.
background_opacity  = 0.0
compositor_blur     = false
shadow              = false
# Slide away with the pointer, come back when it touches the edge.
auto_hide           = true
auto_hide_delay_ms  = 400
reserve_space       = false
# Per-widget capsules would draw seven pills; the group draws one.
capsule             = false
capsule_fill        = "surface_container"
capsule_radius      = 16
capsule_opacity     = 0.88
capsule_border      = "outline_variant"
capsule_border_width = 1.0

# The side pill is Canopy's own surface: desktop functions plus the background
# processes (StatusNotifierItem) of the session. Notifications and audio are
# deliberately not here — they have their own panels.
#
# Everything lives in the *center* lane on purpose. A vertical bar with items in
# both `center` and `end` draws its capsule around both blocks: the centered
# block floats in the middle while `end` is pinned to the bottom, leaving a dead
# band at the top of the pill. One centered lane makes the pill size itself to
# its content and stay visually balanced whatever the tray reports.
start  = []
center = ["group:island"]
end    = []

# One island around everything: fill, radius and padding are the visible pill.
[[bar.tray.capsule_group]]
id           = "island"
members      = ["launcher", "control-center", "tray", "network", "bluetooth", "battery", "settings"]
fill         = "surface_container"
border       = "outline_variant"
border_width = 1.0
padding      = 12.0
radius       = 30.0
opacity      = 0.88

# ── Dock — bottom centre ──────────────────────────────────────────────────────
# Pinned ǀ running ǀ minimized. Pinned ordering is stored in `pinned`, running
# state comes from the compositor, so nothing is simulated.

[dock]
enabled             = true
position            = "bottom"
# The pill is icon + 2x6 cell pad + 2x cross_axis_padding. Icons get the room:
# 56 + 12 + 8 = 76, so the dock stays where it is and the icons grow into it.
icon_size           = 56
# Room between the icons and the pill's own edge: without it the first and last
# icon sit on the rounded end and the row looks like it is falling out.
main_axis_padding   = 20
cross_axis_padding  = 4
item_spacing        = 14
background_opacity  = 0.80
compositor_blur     = true
# Floating dock, 20 px corners, no shadow: the reference lets the fill and the
# hairline carry it instead of a drop shadow.
radius              = 20
radius_top_left     = 20
radius_top_right    = 20
radius_bottom_left  = 20
radius_bottom_right = 20
margin_ends         = 0
margin_edge         = 12
shadow              = false
show_running        = true
# Three islands: pinned applications, running (unpinned), minimized windows.
sections            = "islands"
section_gap         = 0
# The dock slides away as soon as the pointer leaves; only the side island has a
# configurable delay (bar.auto_hide_delay_ms).
auto_hide           = true
smart_auto_hide     = false
reserve_space       = false
layer               = "top"
# Icons keep their full size when a window is not focused; the dot underneath
# says which app is running, the way a dock is supposed to.
active_scale        = 1.0
inactive_scale      = 1.0
magnification       = false
active_opacity      = 1.0
inactive_opacity    = 0.92
show_dots           = true
show_instance_count = false
launcher_position   = "start"
# Traditional launcher glyph, drawn from the icon font. An image path here
# looked right in config and dropped silently in the dock; the glyph always
# resolves.
launcher_icon       = "grid-dots"
launcher_custom_image = ""
launcher_custom_image_colorize = false
pinned              = ["firefox", "thunar", "kitty", "alacritty", "dev.canopy.Canopy"]

# ── Quick Settings — right side ───────────────────────────────────────────────

[control_center]
circular_avatar    = true
show_avatar_border = true

[notification]
enable_daemon             = true
# Windows toast corner, not the macOS top-right one.
position                  = "bottom_right"
keep_dismissed_in_history = true
background_opacity        = 0.92
border                    = true
border_color              = "outline_variant"
border_width              = 1

# ── Behaviour ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled = true

[backdrop]
enabled         = false
blur_intensity  = 0.45
tint_intensity  = 0.30

[wallpaper.default]
# Canopy ships three gradient washes; the shell renders them itself, so there is
# no wallpaper daemon to manage.
path = ""

[audio]
enable_overdrive      = false
enable_sounds         = false
enable_volume_sounds  = true

[bluetooth]
connect_when_enabled     = false
connection_notifications = false

[brightness]
enable_ddcutil = false
# ── Widgets ───────────────────────────────────────────────────────────────────
# The panel launcher shows the Canopy mark instead of a generic search glyph.
# Installer copies the mark to ~/.local/share/icons; if it is missing the widget
# falls back to the bundled glyph named below.

[widget.wordmark]
# The desktop names itself in the menu bar, right after its mark.
type = "text"
text = "Canopy"

[widget.launcher]
# The wordmark next to it already carries the brand; the button itself is the
# familiar launcher glyph, tinted with the accent.
color        = "primary"
glyph        = "grid-dots"
custom_image = ""
custom_image_colorize = false
