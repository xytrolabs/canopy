# ── Canopy on MangoWC — beta ──────────────────────────────────────────────────
#
# MangoWC is a dwl-derived tiling compositor. This is Canopy's *second*
# session: labwc stays the default, and nothing here changes it.
#
#   canopy-session --compositor mangowc     run it once
#   log out, pick "Canopy (MangoWC)" in the display manager   (after --with-mangowc)
#
# MangoWC draws no window decorations of its own, so the traffic lights from
# canopy/openbox-3 are not used here: windows are tiled, borderless and follow
# the shell's palette through the compositor's own border colours.
#
# Keybinds mirror config/labwc/rc.xml as closely as MangoWC allows, so muscle
# memory carries over: Super for the launcher, Super+Q close, Super+arrows focus,
# Super+1..4 tags, Super+Shift+1..4 move to tag.
#
# MangoWC reads this file from $XDG_CONFIG_HOME/mango/config.conf. Edit it
# freely — canopy-session only writes it when there is no config yet.

# ------------------------------------------------------------------- general --
# The modifiers MangoWC reports to clients. Canopy's shell does not care, but
# applications ask.
mod=Super

# Start the shell. MangoWC exports MANGO_INSTANCE_SIGNATURE to its children and
# the shell uses that socket for workspaces and window state, so the shell has
# to be launched *by the compositor* and not before it.
exec-once=canopy

# Nothing else is required: the bar, dock and tray are layer-shell surfaces the
# shell creates itself.

# -------------------------------------------------------------------- layout --
# tiling by default; Super+Space cycles the layouts below.
# tile | dwindle | spiral | monocle | float
layout=tile

borderpx=1
border_radius=10
# Outer/inner gaps so tiled windows read as cards, not a solid grid.
gappoh=8
gappov=8
gappih=4
gappiv=4

# ------------------------------------------------------------------ colours ---
# Close to the Canopy palette; MangoWC wants plain hex, no colour roles.
focuscolor=0x7c5cfcff
unfocuscolor=0x2e2b3dff

# -------------------------------------------------------------------- keybinds
# Launcher and shell surfaces use the same IPC verbs as config/labwc/rc.xml, so
# both sessions drive the shell identically.
bind=SUPER,d,spawn,canopy msg panel-toggle launcher
bind=SUPER,Return,spawn,sh -c 'xdg-terminal-exec 2>/dev/null || alacritty 2>/dev/null || kitty 2>/dev/null || foot'
bind=SUPER,Tab,spawn,canopy msg panel-toggle window-switcher

# Session / shell surfaces
bind=SUPER,i,spawn,canopy msg settings-open
bind=SUPER,a,spawn,canopy msg panel-toggle control-center
bind=SUPER,n,spawn,canopy msg panel-toggle notifications
bind=SUPER,v,spawn,canopy msg panel-toggle clipboard
bind=SUPER,l,spawn,canopy msg session lock
bind=SUPER,q,killclient

# Windows
bind=SUPER,f,togglefloating
bind=SUPER,m,togglefullscreen
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down
bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,right,exchange_client,right
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,down,exchange_client,down

# Tags (Canopy calls them workspaces: 1..4 in the bar)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4

# Layout / compositor
bind=SUPER,space,setlayout,next
bind=SUPER+SHIFT,e,quit

# Media, brightness and screenshots, same as labwc
bind=,XF86AudioRaiseVolume,spawn,canopy msg volume-up
bind=,XF86AudioLowerVolume,spawn,canopy msg volume-down
bind=,XF86AudioMute,spawn,canopy msg volume-mute
bind=,XF86MonBrightnessUp,spawn,canopy msg brightness-up
bind=,XF86MonBrightnessDown,spawn,canopy msg brightness-down
bind=,Print,spawn,canopy msg screenshot-fullscreen