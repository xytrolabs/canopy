# greetd — Canopy login, using the Canopy Greeter fork.
#
# The greeter runs its own wlroots compositor in a separate session, so greetd
# only has to start the session script.
[terminal]
vt = 1
switch = true

[default_session]
# `greeter` is the unprivileged login user greetd expects.
command = "/usr/local/bin/canopy-greeter-session"
user = "greeter"
