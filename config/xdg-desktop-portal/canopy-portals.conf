# Canopy desktop portal configuration.
#
# Labwc implements neither screencopy nor screencast as portal backends, so the
# wlr portal handles those; everything else (file chooser, OpenURI, secrets)
# goes through the GTK backend which Labwc supports fine.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.OpenURI=gtk
org.freedesktop.impl.portal.Settings=gtk